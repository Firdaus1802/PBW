<!DOCTYPE html>
<html>
<head>
    <style>
        table {
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }
        th, td {
            border: 1.5px solid black;
            padding: 6px 16px;
        }
        th {
            background-color: #bfe0f7;
            font-weight: bold;
            text-align: center;
        }
        td {
            text-align: left;
        }
        .tidak-lulus {
            background-color: #f7a9a1;
        }
    </style>
</head>
<body>


<table>
    <tr><th>Nama</th><th>Rata-rata</th><th>Grade</th></tr>

        <tr class="lulus">
        <td>Andi</td>
        <td>84.3</td>
        <td>B</td>
    </tr>
        <tr class="tidak-lulus">
        <td>Eko</td>
        <td>45.0</td>
        <td>C</td>
    </tr>
    </table>

</body>
</html>
